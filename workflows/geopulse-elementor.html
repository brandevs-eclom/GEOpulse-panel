<!-- GEOpulse · widget "HTML" de Elementor · aislado con Shadow DOM -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<div id="geopulse-host"></div>

<template id="geopulse-tpl">
<style>
:host{
  --gp-bg:#F6F5F2; --gp-surface:#FFFFFF; --gp-dark:#262523; --gp-dark-soft:#3D3B37; --gp-dark-line:#403E3A;
  --gp-border:#E7E4DE; --gp-border-strong:#D6D2C9;
  --gp-text:#121212; --gp-text-muted:#6E6B66; --gp-on-dark:#FFFFFF; --gp-on-dark-muted:#B4B0A9;
  --gp-accent:#EF3B2D; --gp-accent-dark:#D22C1F; --gp-accent-soft:#FDECEA; --gp-accent-light:#FF6152;
  --gp-ok:#17915B; --gp-ok-soft:#E8F4EE;
  --gp-warn:#C07600; --gp-warn-soft:#FBF0DE;
  --gp-err:#B42318; --gp-err-soft:#FBEBE9;
  --gp-muted:#9C9791; --gp-muted-soft:#F0EEEA;
  --gp-r:14px; --gp-r-sm:10px; --gp-pill:999px;
  --gp-display:'Manrope',system-ui,sans-serif; --gp-ui:'Inter',system-ui,sans-serif;
  display:block;box-sizing:border-box;
  background:transparent;
  color:var(--gp-text);font-family:var(--gp-ui);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;padding:40px 20px 64px;overflow-wrap:break-word;
}
@media(max-width:560px){:host{padding:26px 14px 44px}}
*{box-sizing:border-box;margin:0;padding:0}
.wrap{max-width:1140px;margin:0 auto}
@media(max-width:560px){body{padding:26px 14px 44px}}

h1,h2,h3,h4{font-family:var(--gp-display);font-weight:800;letter-spacing:-.025em;line-height:1.15;color:var(--gp-text)}
.eyebrow{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gp-accent);margin-bottom:12px}
.eyebrow-dark{color:var(--gp-accent)}
.lead{color:var(--gp-text-muted);font-size:1.02rem;max-width:640px}

/* Cabecera */
.head{text-align:center;padding:16px 0 36px}
.head h1{font-size:clamp(1.8rem,6.4vw,2.9rem);margin-bottom:16px}
.head h1 u{text-decoration:underline;text-decoration-color:var(--gp-accent);text-decoration-thickness:.13em;text-underline-offset:.15em}
.head .lead{margin:0 auto}
@media(max-width:560px){.head{padding:8px 0 28px}.head .lead{font-size:.95rem}}

/* Formulario */
.form{background:var(--gp-surface);border:1px solid var(--gp-border);border-radius:var(--gp-r);padding:32px;margin-bottom:36px}
@media(max-width:560px){.form{padding:20px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-geo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
@media(max-width:760px){.grid2,.grid-geo{grid-template-columns:1fr;gap:14px}}
.field{display:flex;flex-direction:column;gap:7px}
label{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gp-text-muted)}
label .req{color:var(--gp-accent)}
/* 16px exactos: por debajo de eso iOS hace zoom automatico al enfocar el campo */
input,select{font-family:var(--gp-ui);font-size:16px;background:var(--gp-surface);border:1px solid var(--gp-border-strong);
  border-radius:var(--gp-r-sm);padding:14px 15px;color:var(--gp-text);outline:none;width:100%;
  transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#B8B4AE}
input:focus,select:focus{border-color:var(--gp-accent);box-shadow:0 0 0 3px var(--gp-accent-soft)}
select{appearance:none;cursor:pointer;padding-right:38px;
  background-image:linear-gradient(45deg,transparent 50%,var(--gp-text-muted) 50%),linear-gradient(135deg,var(--gp-text-muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
.hint{color:var(--gp-muted);font-size:.8rem;line-height:1.5;margin-bottom:20px}
.field-full{margin-bottom:22px}

.btn{font-family:var(--gp-ui);font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:none;
  border-radius:var(--gp-pill);padding:17px 32px;min-height:52px;cursor:pointer;
  transition:background .15s,transform .1s,color .15s,border-color .15s}
.btn-primary{background:var(--gp-accent);color:#fff;width:100%}
.btn-primary:hover:not(:disabled){background:var(--gp-accent-dark)}
.btn-primary:active:not(:disabled){transform:scale(.995)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--gp-text);border:1px solid var(--gp-border-strong)}
.btn-ghost:hover{border-color:var(--gp-text)}
.btn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gp-accent);outline-offset:2px}
.form-error{color:var(--gp-err);font-size:.88rem;margin-top:12px;display:none}

/* Loader */
.loader{display:none;text-align:center;padding:56px 0}
.spinner{width:38px;height:38px;border:3px solid var(--gp-border);border-top-color:var(--gp-accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}}
.loader .phase{font-family:var(--gp-display);font-weight:700;font-size:1.02rem;margin-bottom:8px;padding:0 8px}
.loader .sub{color:var(--gp-text-muted);font-size:.86rem;max-width:520px;margin:0 auto}
.loader .clock{color:var(--gp-muted);font-size:.8rem;margin-top:12px;font-variant-numeric:tabular-nums}

/* Aviso de error */
.errbox{display:none;background:var(--gp-err-soft);border:1px solid #F0CFCB;border-radius:var(--gp-r);padding:24px;margin-bottom:28px}
@media(max-width:560px){.errbox{padding:18px}}
.errbox h3{font-size:1.02rem;color:var(--gp-err);margin-bottom:8px}
.errbox p{color:var(--gp-text-muted);font-size:.9rem;word-break:break-word}
.errbox .btn{margin-top:16px;padding:12px 24px;min-height:44px}

#results{display:none}
.meta{color:var(--gp-muted);font-size:.76rem;text-align:right;margin-bottom:16px;line-height:1.6}
@media(max-width:760px){.meta{text-align:left}}

/* Bloque oscuro */
.dark{background:var(--gp-dark);color:var(--gp-on-dark);border-radius:var(--gp-r);padding:44px;margin-bottom:20px}
.dark h2,.dark h3{color:var(--gp-on-dark)}
.dark p{color:var(--gp-on-dark-muted)}
.score-row{display:grid;grid-template-columns:170px 1fr;gap:40px;align-items:center}
@media(max-width:820px){.score-row{grid-template-columns:1fr;gap:26px;text-align:center}}
@media(max-width:560px){.dark{padding:26px 20px}}
.ring{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
.ring-in{width:142px;height:142px;border-radius:50%;background:var(--gp-dark);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-family:var(--gp-display);font-size:2.8rem;font-weight:800;color:#fff;line-height:1}
.ring-lbl{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gp-on-dark-muted);margin-top:6px}
.score-row h3{font-size:clamp(1.25rem,4.4vw,1.5rem);margin-bottom:12px}
.score-row p{font-size:.98rem;line-height:1.75}
@media(max-width:560px){.score-row p{font-size:.92rem;text-align:left}}

/* Tiles de área */
.areas{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:44px}
@media(max-width:900px){.areas{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(max-width:520px){.areas{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--gp-surface);border:1px solid var(--gp-border);border-radius:var(--gp-r-sm);padding:16px}
.tile .t-lbl{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gp-muted);margin-bottom:9px;line-height:1.3}
.tile .t-val{font-family:var(--gp-display);font-size:1.55rem;font-weight:800;line-height:1;margin-bottom:10px}
.bar{height:4px;background:var(--gp-muted-soft);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px}

/* Cabecera de sección */
.sec{text-align:center;margin:52px 0 26px}
.sec h2{font-size:clamp(1.42rem,5.2vw,2rem);margin-bottom:10px}
.sec p{color:var(--gp-text-muted);font-size:.93rem;max-width:620px;margin:0 auto}
@media(max-width:560px){.sec{margin:40px 0 22px}}

/* Acordeón de preguntas */
.qs{margin-bottom:26px}
.q-item{border:1px solid var(--gp-border);border-radius:var(--gp-r-sm);background:var(--gp-surface);margin-bottom:8px}
.q-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 18px;min-height:56px;background:transparent;border:none;cursor:pointer;text-align:left;font-family:var(--gp-ui)}
.q-head:hover .q-title{color:var(--gp-accent)}
.q-title{display:block;font-family:var(--gp-display);font-weight:700;font-size:.96rem;color:var(--gp-text);transition:color .15s;line-height:1.35}
.q-sub{display:block;font-size:.74rem;color:var(--gp-muted);margin-top:3px}
.q-pm{font-family:var(--gp-display);font-size:1.35rem;font-weight:700;line-height:1;color:var(--gp-accent);flex-shrink:0}
.q-body{display:none;padding:16px 18px 18px;border-top:1px solid var(--gp-border)}
.q-body.open{display:block}
.q-body ol{margin:0;padding-left:20px}
.q-body li{font-size:.9rem;line-height:1.65;color:var(--gp-text-muted);margin-bottom:11px}
.q-body li:last-child{margin-bottom:0}
.q-body li::marker{color:var(--gp-accent);font-weight:700}
@media(max-width:560px){.q-head{padding:14px 15px}.q-body{padding:14px 15px 16px}.q-body li{font-size:.86rem}}

/* Veredicto */
.verdict{display:flex;align-items:center;gap:24px;background:var(--gp-surface);border:1px solid var(--gp-border);
  border-left:4px solid var(--gp-accent);border-radius:0 var(--gp-r) var(--gp-r) 0;padding:26px 28px;margin-bottom:20px}
@media(max-width:700px){.verdict{flex-direction:column;align-items:flex-start;gap:16px;padding:22px 20px;
  border-left:none;border-top:4px solid var(--gp-accent);border-radius:0 0 var(--gp-r) var(--gp-r)}}
.v-chip{flex-shrink:0;font-family:var(--gp-display);font-size:.92rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:11px 20px;border-radius:var(--gp-pill)}
.v-invisible{background:var(--gp-err-soft);color:var(--gp-err)}
.v-emergente{background:var(--gp-warn-soft);color:var(--gp-warn)}
.v-competitiva{background:var(--gp-accent-soft);color:var(--gp-accent-dark)}
.v-dominante{background:var(--gp-ok-soft);color:var(--gp-ok)}
.verdict p{color:var(--gp-text-muted);font-size:.92rem}
.exec{background:var(--gp-surface);border:1px solid var(--gp-border);border-radius:var(--gp-r);padding:28px;margin-bottom:26px;font-size:.98rem;line-height:1.8}
@media(max-width:560px){.exec{padding:20px;font-size:.93rem;line-height:1.75}}

/* Tarjetas */
.grid-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}
@media(max-width:900px){.grid-cards{grid-template-columns:1fr;gap:16px}}
.card{background:var(--gp-surface);border:1px solid var(--gp-border);border-radius:var(--gp-r);padding:26px}
@media(max-width:560px){.card{padding:20px}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.card-eyebrow{font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gp-muted)}
.card h3{font-size:1.1rem;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--gp-border)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
.dot-ok{background:var(--gp-ok)} .dot-warning{background:var(--gp-warn)} .dot-error{background:var(--gp-err)} .dot-muted{background:var(--gp-muted)}
.card-text{color:var(--gp-text-muted);font-size:.89rem;line-height:1.7;margin-bottom:10px}
.card-text b{color:var(--gp-text);font-weight:600}

.metric{margin-bottom:15px}
.metric:last-child{margin-bottom:0}
.m-row{display:flex;justify-content:space-between;gap:14px;font-size:.89rem;align-items:baseline}
.m-lbl{color:var(--gp-text-muted)}
.m-val{font-weight:600;text-align:right;flex-shrink:0}
@media(max-width:560px){.m-row{flex-direction:column;gap:2px}.m-val{text-align:left;flex-shrink:1}}
.v-ok{color:var(--gp-ok)} .v-warning{color:var(--gp-warn)} .v-error{color:var(--gp-err)} .v-muted{color:var(--gp-muted)}
.m-detail{color:var(--gp-muted);font-size:.78rem;line-height:1.6;margin-top:4px}
.srcs{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.srcs a{color:var(--gp-accent);font-size:.75rem;font-weight:500;text-decoration:none;word-break:break-all}
.srcs a:hover{text-decoration:underline}

.tags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}
.tag{background:var(--gp-muted-soft);border:1px solid var(--gp-border);padding:5px 11px;border-radius:var(--gp-pill);font-size:.75rem;font-weight:500;color:var(--gp-text-muted)}
.tag-accent{background:var(--gp-accent-soft);border-color:#F6CFCA;color:var(--gp-accent-dark)}
.tag-neg{background:var(--gp-err-soft);border-color:#F0CFCB;color:var(--gp-err)}
.tag-ok{background:var(--gp-ok-soft);border-color:#CDE6DA;color:var(--gp-ok)}

.eeatc{margin-bottom:16px}
.eeatc .bar{margin-top:7px}

/* Dónde ganar presencia */
.reco-group{margin-bottom:20px}
.reco-cat{font:700 .68rem var(--gp-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gp-muted);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--gp-border)}
.reco-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--gp-border)}
.reco-item:last-child{border-bottom:none}
.reco-left{min-width:0}
.reco-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.reco-site{font:700 .95rem var(--gp-display);color:var(--gp-text);word-break:break-word}
.reco-link{text-decoration:none}
.reco-link:hover{color:var(--gp-accent);text-decoration:underline}
.reco-src{font:700 .58rem var(--gp-ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:var(--gp-pill);white-space:nowrap}
.src-cita{background:var(--gp-dark);color:#fff}
.src-desc{background:var(--gp-accent-soft);color:var(--gp-accent-dark)}
.reco-why{display:block;font:400 .8rem/1.5 var(--gp-ui);color:var(--gp-muted);margin-top:2px}
.reco-pri{flex-shrink:0;font:700 .62rem var(--gp-ui);letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:var(--gp-pill)}
.pri-alta{background:var(--gp-accent-soft);color:var(--gp-accent-dark)}
.pri-media{background:var(--gp-warn-soft);color:var(--gp-warn)}
.pri-baja{background:var(--gp-muted-soft);color:var(--gp-muted)}
@media(max-width:560px){.reco-item{flex-direction:column;align-items:flex-start;gap:8px}}

/* Paneles */
.panel{background:var(--gp-surface);border:1px solid var(--gp-border);border-radius:var(--gp-r);padding:30px;margin-bottom:22px}
/* Ruptura de texto: ningún contenido (URLs, strings largos) se sale de su caja */
.card,.panel,.tile,.exec,.verdict,.q-item{min-width:0;max-width:100%}
.m-detail,.card-text,.m-val,.m-lbl,.tag,.reco-site,.reco-why,.reco-src,.exec,.q-body,.tile-detail{overflow-wrap:anywhere;word-break:break-word}
.srcs a,.reco-link{overflow-wrap:anywhere;word-break:break-all}
.m-row{min-width:0}
.m-row .m-lbl{min-width:0;overflow-wrap:anywhere}
/* Bloques colapsables: los muy largos se encogen con un botón "Mostrar más" */
.collapse-inner{overflow:hidden;transition:max-height .35s ease;position:relative}
.has-collapse{position:relative}
.has-collapse .collapse-inner::after{content:'';position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--gp-surface));pointer-events:none;transition:opacity .25s;opacity:1}
.has-collapse.open .collapse-inner::after{opacity:0}
.show-more{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:none;border:none;cursor:pointer;
  font:700 .72rem var(--gp-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--gp-accent);padding:6px 0}
.show-more:hover{text-decoration:underline}
.show-more::after{content:'▾';font-size:.9em;transition:transform .2s}
.has-collapse.open .show-more::after{transform:rotate(180deg)}
@media(max-width:560px){.panel{padding:20px}}
.panel h3{font-size:clamp(1.1rem,4.2vw,1.25rem);margin-bottom:8px}
.panel-dark{background:var(--gp-dark);border-color:var(--gp-dark-line)}
.panel-dark h3{color:#fff}
.panel-dark .card-text{color:var(--gp-on-dark-muted)}
.panel-dark .donut-t{color:#96918A}
.panel-dark .d-lbl{fill:#96918A}
.panel-dark .legend{border-top-color:rgba(255,255,255,.14)}
.panel-dark .leg{color:var(--gp-on-dark-muted)}
.panel-dark .leg-brand{color:#fff}
.panel-dark th{color:#96918A;border-bottom-color:rgba(255,255,255,.2)}
.panel-dark td{color:var(--gp-on-dark-muted);border-bottom-color:rgba(255,255,255,.09)}
.panel-dark td.strong{color:#fff}
.panel-dark tr.brand td{background:rgba(239,59,45,.16)}
.panel-dark tr.brand td.strong{color:var(--gp-accent-light)}
.panel-dark .toggle{border-color:rgba(255,255,255,.24);color:#fff}
.panel-dark .toggle:hover{border-color:var(--gp-accent);color:var(--gp-accent-light)}
.panel-dark .toggle .pm{color:var(--gp-accent-light)}

/* Donuts */
.donuts{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:26px 0 10px}
@media(max-width:900px){.donuts{grid-template-columns:repeat(2,1fr);gap:16px}}
@media(max-width:360px){.donuts{grid-template-columns:1fr}}
.donut{text-align:center}
.donut-t{font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gp-muted);margin-bottom:10px}
.donut svg{width:100%;max-width:158px;height:auto;display:block;margin:0 auto}
.d-pct{font-family:'Manrope',sans-serif;font-size:23px;font-weight:800}
.d-lbl{font-size:8.5px;font-weight:600;fill:var(--gp-muted);letter-spacing:.1em;text-transform:uppercase;font-family:'Inter',sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:9px 18px;justify-content:center;margin:18px 0 22px;padding-top:18px;border-top:1px solid var(--gp-border)}
.leg{display:flex;align-items:center;gap:7px;font-size:.77rem;color:var(--gp-text-muted)}
.leg-brand{color:var(--gp-text);font-weight:600}
.leg i{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* Tablas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gp-muted);padding:11px 12px;border-bottom:1px solid var(--gp-border-strong)}
td{padding:13px 12px;border-bottom:1px solid var(--gp-border);vertical-align:top;line-height:1.55;color:var(--gp-text-muted)}
tr:last-child td{border-bottom:none}
td.strong{font-weight:600;color:var(--gp-text);white-space:nowrap}
tr.brand td{background:var(--gp-accent-soft)}
tr.brand td.strong{color:var(--gp-accent-dark)}
tr.hide{display:none}
tr.hide.show{display:table-row}

/* Tablas en movil: cada fila pasa a ser una ficha apilada (sin scroll horizontal) */
@media(max-width:760px){
  .tw{overflow-x:visible}
  .tw table,.tw tbody,.tw tr,.tw td{display:block;width:100%}
  .tw thead{display:none}
  .tw tr{border:1px solid var(--gp-border);border-radius:var(--gp-r-sm);padding:14px 16px;margin-bottom:10px}
  .tw tr:last-child{margin-bottom:0}
  .tw td{border:none;padding:6px 0;color:var(--gp-text-muted)}
  .tw td::before{content:attr(data-label);display:block;font-size:.6rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--gp-muted);margin-bottom:2px}
  .tw td.strong{white-space:normal;font-size:1rem;padding-top:0;padding-bottom:8px}
  .tw td.strong::before{display:none}
  .tw tr.brand{background:var(--gp-accent-soft);border-color:var(--gp-accent)}
  .tw tr.brand td{background:transparent}
  .tw tr.hide{display:none}
  .tw tr.hide.show{display:block}

<script>
(function(){
'use strict';
var host = document.getElementById('geopulse-host');
var tpl  = document.getElementById('geopulse-tpl');
if (!host || !tpl || host.shadowRoot) return;
var shadow = host.attachShadow({ mode: 'open' });
shadow.appendChild(tpl.content.cloneNode(true));

const WEBHOOK_URL = 'https://api.brandevs.com/webhook/geopulse-audit-v4';
const TIMEOUT_MS = 420000;

const $id = (i) => shadow.getElementById(i);
const btn = $id('btn');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function svg(tag, attrs){
  const n = document.createElementNS(NS, tag);
  Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v));
  return n;
}
const ICON = { ok:'✓', warning:'!', error:'✕', no_verificable:'–' };
const norm = (e) => (e === 'ok' || e === 'warning' || e === 'error') ? e : 'no_verificable';
const cls = (e) => norm(e) === 'no_verificable' ? 'v-muted' : 'v-' + norm(e);
function worst(estados){
  const e = estados.map(norm);
  if (e.includes('error')) return 'error';
  if (e.includes('warning')) return 'warning';
  if (e.includes('ok')) return 'ok';
  return 'muted';
}
function tono(v){ return v === null || v === undefined ? 'var(--gp-muted)' : v >= 75 ? 'var(--gp-ok)' : v >= 50 ? 'var(--gp-warn)' : 'var(--gp-err)'; }
const g = (o, p) => p.split('.').reduce((x, k) => (x && x[k] !== undefined && x[k] !== null) ? x[k] : null, o);

function metric(label, estado, valueText, detail, fuentes){
  const w = el('div','metric');
  const r = el('div','m-row');
  r.appendChild(el('span','m-lbl', label));
  const v = el('span','m-val ' + cls(estado));
  v.textContent = (ICON[norm(estado)] || '–') + ' ' + (valueText || norm(estado).replace('_',' '));
  r.appendChild(v);
  w.appendChild(r);
  if (detail) w.appendChild(el('p','m-detail', detail));
  if (Array.isArray(fuentes) && fuentes.length){
    const s = el('div','srcs');
    fuentes.slice(0,4).forEach(u => {
      if (typeof u !== 'string' || !/^https?:\/\//i.test(u)) return;
      const a = el('a', null, u.replace(/^https?:\/\//,'').slice(0,52));
      a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer';
      s.appendChild(a);
    });
    if (s.children.length) w.appendChild(s);
  }
  return w;
}
function card(eyebrow, title, dot){
  const c = el('div','card');
  const t = el('div','card-top');
  t.appendChild(el('span','card-eyebrow', eyebrow));
  t.appendChild(el('span','dot dot-' + (dot || 'muted')));
  c.appendChild(t);
  c.appendChild(el('h3', null, title));
  return c;
}
function barra(v){
  const b = el('div','bar'), s = el('span');
  s.style.width = (v || 0) + '%';
  s.style.background = tono(v);
  b.appendChild(s);
  return b;
}
function tabla(heads, rows, visibles){
  const tw = el('div','tw');
  const t = el('table');
  const th = el('thead'), tr = el('tr');
  heads.forEach(h => tr.appendChild(el('th', null, h)));
  th.appendChild(tr); t.appendChild(th);
  const tb = el('tbody');
  rows.forEach((r, i) => {
    const row = el('tr', (r._brand ? 'brand ' : '') + (visibles && i >= visibles ? 'hide' : ''));
    (r.cells || r).forEach((c, j) => {
      const cell = el('td', j === 0 ? 'strong' : '', c);
      cell.setAttribute('data-label', heads[j] || '');
      row.appendChild(cell);
    });
    tb.appendChild(row);
  });
  t.appendChild(tb); tw.appendChild(t);
  return tw;
}
function accion(a, i){
  const row = el('div','act');
  const pr = String(a.prioridad || 'media').toLowerCase();
  row.appendChild(el('span','num p-' + (['alta','media','baja'].includes(pr) ? pr : 'media'), i + 1));
  const b = el('div','act-b');
  const tag = a.area || (a.esfuerzo ? 'Esfuerzo ' + a.esfuerzo : null);
  if (tag) b.appendChild(el('div','a-tag', tag + ' · Prioridad ' + pr));
  b.appendChild(el('div','a-txt', a.accion || ''));
  if (a.por_que) b.appendChild(el('div','a-sub', a.por_que));
  if (a.evidencia) b.appendChild(el('div','a-ev', '“' + a.evidencia + '”'));
  if (a.impacto_esperado) b.appendChild(el('div','a-sub', '→ ' + a.impacto_esperado));
  row.appendChild(b);
  return row;
}
function seccion(root, eyebrow, titulo, sub){

const MODELOS = [['chatgpt','ChatGPT'],['claude','Claude'],['perplexity','Perplexity']];

/* ---------- Render ---------- */
/* Colapsa los bloques MUY largos con botón "Mostrar más", pero SOLO en las secciones
   marcadas como .colapsable (SEO Técnico y Huella Digital) y solo si superan un alto grande. */
function colapsarBloquesLargos(){
  const root = $id('results');
  if (!root) return;
  const MAX = 640;                        // alto al que se recorta el bloque una vez colapsado (px)
  const UMBRAL = 2000;                     // solo se colapsa si el contenido original supera esto (px)
  root.querySelectorAll('.colapsable .card, .colapsable .panel').forEach(box => {
    if (box.dataset.collapse) return;      // no reprocesar
    if (box.scrollHeight <= UMBRAL) return;   // solo bloques MUY largos
    box.dataset.collapse = '1';
    const inner = document.createElement('div');
    inner.className = 'collapse-inner';
    while (box.firstChild) inner.appendChild(box.firstChild);
    box.appendChild(inner);
    inner.style.maxHeight = MAX + 'px';
    box.classList.add('has-collapse');
    const btn = document.createElement('button');
    btn.className = 'show-more';
    btn.type = 'button';
    btn.textContent = 'Mostrar más';
    let abierto = false;
    btn.addEventListener('click', () => {
      abierto = !abierto;
      box.classList.toggle('open', abierto);
      inner.style.maxHeight = abierto ? inner.scrollHeight + 'px' : MAX + 'px';
      btn.textContent = abierto ? 'Mostrar menos' : 'Mostrar más';
      if (!abierto) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    box.appendChild(btn);
  });
}

/* Pinta el acordeón de "las preguntas que hemos lanzado". Separada para poder colocarla
   al principio del informe (antes de SEO Técnico), no dentro de la sección de visibilidad. */
function pintarPreguntas(root, r, bl){
  const QB = [
    ['descubrimiento','Descubrimiento','¿Emerges cuando nadie te nombra?'],
    ['competitivo','Competitivo','¿Con quién te compara la IA?'],
    ['conocimiento','Conocimiento','¿Qué sabe de ti y es cierto?'],
    ['reputacion','Reputación','¿Qué dice cuando el cliente duda?']
  ];
  const PREG = Object.assign({}, r.preguntas || {});
  if (!QB.some(([k]) => (PREG[k] || []).length)){
    const dp = g(bl,'descubrimiento.detalle_preguntas');
    if (Array.isArray(dp)) PREG.descubrimiento = dp.map(x => x.pregunta).filter(Boolean);
  }
  const totalQ = QB.reduce((a,[k]) => a + (PREG[k] || []).length, 0);
  if (!totalQ) return;
  const p = el('div','panel');
  p.appendChild(el('span','eyebrow','Metodología'));
  p.appendChild(el('h3', null, 'Las ' + totalQ + ' preguntas que hemos lanzado'));
  p.appendChild(el('p','card-text','Las mismas para los tres modelos, formuladas como las haría un cliente real y ancladas a tu mercado. En descubrimiento y competitivo no se fuerza la mención de tu marca: si apareces, apareces sola.'));
  const acc = el('div','qs');
  QB.forEach(([k, titulo, sub]) => {
    const qs = PREG[k] || [];
    if (!qs.length) return;
    const item = el('div','q-item');
    const head = el('button','q-head');
    head.type = 'button';
    const txt = el('div');
    txt.appendChild(el('span','q-title', titulo));
    txt.appendChild(el('span','q-sub', sub + '  ·  ' + qs.length + ' preguntas'));
    head.appendChild(txt);
    const pm = el('span','q-pm','+');
    head.appendChild(pm);
    const body = el('div','q-body');
    const ol = el('ol');
    qs.forEach(q => ol.appendChild(el('li', null, q)));
    body.appendChild(ol);
    head.setAttribute('aria-expanded','false');
    head.addEventListener('click', () => {
      const open = body.classList.toggle('open');
      pm.textContent = open ? '–' : '+';
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    item.appendChild(head);
    item.appendChild(body);
    acc.appendChild(item);
  });
  p.appendChild(acc);
  root.appendChild(p);
}

function render(r){
  const root = $id('results');
  root.textContent = '';

  const meta = r.meta || {};
  const mercado = meta.geo ? meta.geo.texto : null;
  root.appendChild(el('p','meta', [meta.brand, meta.domain, mercado ? 'Mercado: ' + mercado : null,
    meta.fecha ? new Date(meta.fecha).toLocaleString('es-ES') : null,
    meta.sondeos_totales ? meta.sondeos_totales + ' sondeos' : null].filter(Boolean).join('  ·  ')));

  /* Confusión de entidad */
  const bl = r.sondeo_llm || {};
  const confus = [g(bl,'descubrimiento.confusion_entidad'), g(bl,'conocimiento.confusion_entidad')].filter(x => x && x.detectada);
  if (confus.length){
    const w = el('div','errbox');
    w.style.display = 'block';
    w.appendChild(el('h3', null, 'Confusión de entidad detectada'));
    w.appendChild(el('p', null, confus.map(x => x.detalle).filter(Boolean).join(' ')
      || 'Al menos un modelo describe una empresa homónima distinta de la auditada.'));
    root.appendChild(w);
  }

  /* Score en bloque negro */
  const score = g(r,'score.global');
  const d = el('div','dark');
  const row = el('div','score-row');
  const ring = el('div','ring');
  const col = tono(score);
  ring.style.background = (score === null) ? 'var(--gp-dark-soft)'
    : 'conic-gradient(' + col + ' ' + (score * 3.6) + 'deg, var(--gp-dark-soft) 0deg)';
  const inn = el('div','ring-in');
  inn.appendChild(el('div','ring-num', score === null ? '–' : score));
  inn.appendChild(el('div','ring-lbl','GEO Score'));
  ring.appendChild(inn);
  row.appendChild(ring);
  const txt = el('div');
  txt.appendChild(el('span','eyebrow eyebrow-dark','Diagnóstico global'));
  txt.appendChild(el('h3', null, 'Así te ve hoy la inteligencia artificial'));
  txt.appendChild(el('p', null, g(r,'sintesis.diagnostico_ejecutivo') || 'Auditoría completada.'));
  row.appendChild(txt);
  d.appendChild(row);
  root.appendChild(d);

  /* Tiles por área */
  const AREAS = [['infraestructura','Infraestructura'],['seo_tecnico','SEO técnico'],['contenido','Contenido'],['sov','Visibilidad IA'],['huella','Huella externa']];
  const pa = g(r,'score.por_area') || {};
  const tiles = el('div','areas');
  AREAS.forEach(([k, lab]) => {
    const v = typeof pa[k] === 'number' ? pa[k] : null;
    const t = el('div','tile');
    t.appendChild(el('div','t-lbl', lab));
    const val = el('div','t-val', v === null ? '–' : v);
    val.style.color = tono(v);
    t.appendChild(val);
    t.appendChild(barra(v));
    tiles.appendChild(t);
  });
  root.appendChild(tiles);

  /* ===== LAS PREGUNTAS QUE LANZAMOS (primera sección, antes de SEO Técnico) ===== */
  pintarPreguntas(root, r, bl);

  /* ===== SEO TÉCNICO (reorganizado en funnel: rastreo -> lectura -> comprensión) ===== */
  seccion(root, 'Cimientos', 'SEO Técnico',
    'La base técnica que decide si la IA puede encontrarte, leerte y entenderte. Verificado contra fuentes reales: tu servidor y el validador oficial de schema.org.');
  const gridT = el('div','grid-cards colapsable');
  root.appendChild(gridT);

  const seo = r.seo_tecnico || {};
  const infra = r.infraestructura_geo || {};

  /* Bloque 1 — Rastreo: ¿pueden los bots de IA llegar a tu web? (robots.txt + edge + sitemap) */
  const cRas = card('Rastreo', '¿Pueden llegar los bots de IA?',
    worst([g(seo,'rastreo_bots_ia.estado'), g(seo,'acceso_edge.estado'), g(infra,'sitemap.estado')]));
  const bpc = g(seo,'rastreo_bots_ia.bloqueados_por_categoria');
  let bots = null;
  if (bpc){
    const ps = [];
    if ((bpc.retrieval || []).length) ps.push('Retrieval: ' + bpc.retrieval.join(', '));
    if ((bpc.user_fetch || []).length) ps.push('User-fetch: ' + bpc.user_fetch.join(', '));
    if ((bpc.training || []).length) ps.push('Training (sin coste de citación): ' + bpc.training.join(', '));
    bots = ps.length ? ps.join(' · ') : 'Sin bloqueos';
  }
  cRas.appendChild(metric('Bots de IA (robots.txt)', g(seo,'rastreo_bots_ia.estado'), null,
    [bots, g(seo,'rastreo_bots_ia.detalle')].filter(Boolean).join(' — ')));
  if (seo.acceso_edge){
    const bq = (g(seo,'acceso_edge.bots_bloqueados_edge') || []).join(', ');
    cRas.appendChild(metric('Acceso real (CDN/WAF)', g(seo,'acceso_edge.estado'), bq ? 'Bloqueados: ' + bq : null, g(seo,'acceso_edge.detalle')));
  }
  cRas.appendChild(metric('Sitemap XML', g(infra,'sitemap.estado'), null, g(infra,'sitemap.detalle')));
  const robs = g(seo,'rastreo_bots_ia.reglas_obsoletas');
  if (Array.isArray(robs) && robs.length) cRas.appendChild(metric('Reglas obsoletas en robots.txt', 'warning', String(robs.length), robs.join(' · ')));
  gridT.appendChild(cRas);

  /* Bloque 2 — Indexación y renderizado: ¿pueden leer e indexar tu contenido? */
  const cIdx = card('Indexación', 'Lectura y renderizado',
    worst([g(seo,'indexabilidad.estado'), g(seo,'renderizado.estado'), g(seo,'jerarquia_contenido.estado')]));
  cIdx.appendChild(metric('Indexabilidad', g(seo,'indexabilidad.estado'), null, g(seo,'indexabilidad.detalle')));
  if (seo.renderizado) cIdx.appendChild(metric('Renderizado sin JS', g(seo,'renderizado.estado'), null, g(seo,'renderizado.detalle')));
  cIdx.appendChild(metric('Jerarquía de encabezados', g(seo,'jerarquia_contenido.estado'), null, g(seo,'jerarquia_contenido.detalle')));
  /* Detalle de la jerarquía de encabezados PÁGINA POR PÁGINA (antes se perdía) */
  const jpp = g(seo,'jerarquia_contenido.por_pagina');
  if (Array.isArray(jpp) && jpp.length){
    cIdx.appendChild(el('p','m-detail','Análisis página por página:'));
    jpp.slice(0,15).forEach(pg => {
      const est = ['ok','warning','error'].includes(pg.estado) ? pg.estado : 'warning';
      const u = String(pg.url || '').replace(/^https?:\/\//,'').replace(/\/$/,'');
      cIdx.appendChild(metric(u || 'Página', est, null, pg.detalle));
    });
  }
  gridT.appendChild(cIdx);

  /* Bloque 3 — Datos estructurados: ¿entiende la IA qué eres? (schema + validador + llms.txt) */
  const cDat = card('Datos estructurados', 'Señales que la IA interpreta',
    worst([g(infra,'schema.estado'), g(infra,'llms_txt.estado')]));
  const tip = (g(infra,'schema.tipos_detectados') || []).join(', ');
  const aus = (g(infra,'schema.campos_ausentes') || []).join(', ');
  const inv = (g(infra,'schema.propiedades_invalidas') || []).join(', ');
  cDat.appendChild(metric('Marcado Schema (JSON-LD)', g(infra,'schema.estado'), tip || null,
    [g(infra,'schema.detalle'), aus ? 'Campos ausentes: ' + aus : null, inv ? 'Propiedades inválidas: ' + inv : null].filter(Boolean).join(' ')));
  const vo = infra.validador_oficial;
  if (vo && vo.disponible){
    const ne = vo.num_errores || 0, nw = vo.num_warnings || 0;
    cDat.appendChild(metric('Validador schema.org', ne > 0 ? 'error' : nw > 0 ? 'warning' : 'ok', ne + ' errores · ' + nw + ' avisos', null));
  } else if (vo){
    cDat.appendChild(metric('Validador schema.org', 'no_verificable', 'no disponible', 'El validador no respondió; la evaluación se basa en el análisis propio.'));
  }
  cDat.appendChild(metric('Archivo llms.txt', g(infra,'llms_txt.estado'), null, g(infra,'llms_txt.detalle')));
  const cobL = g(infra,'schema.cobertura_landings');
  if (cobL && typeof cobL === 'string') cDat.appendChild(el('p','m-detail','Cobertura en páginas internas: ' + cobL));
  gridT.appendChild(cDat);

  /* Bloque 4 — Contenido optimizado para IA */
  const cont = r.contenido_geo || {};
  const cCon = card('Contenido', 'Contenido optimizado para IA', worst([g(cont,'indice_autoridad.estado'), g(cont,'intent_match.estado'), g(cont,'estructura_extraccion.estado')]));
  cCon.appendChild(metric('Índice de autoridad (datos/citas)', g(cont,'indice_autoridad.estado'), null, g(cont,'indice_autoridad.detalle')));
  cCon.appendChild(metric('Alineación con la intención', g(cont,'intent_match.estado'), null, g(cont,'intent_match.detalle')));
  cCon.appendChild(metric('Chunks autocontenidos', g(cont,'estructura_extraccion.estado'), null, g(cont,'estructura_extraccion.detalle')));
  if (cont.tono) cCon.appendChild(metric('Tono percibido', 'ok', cont.tono, null));
  gridT.appendChild(cCon);

  /* Bloque 5 — Semántica */
  const cl = typeof cont.claridad_nucleo === 'number' ? cont.claridad_nucleo : null;
  const cSem = card('Semántica', 'Cómo lee la IA tu web', cl === null ? 'muted' : cl >= 75 ? 'ok' : cl >= 50 ? 'warning' : 'error');
  cSem.appendChild(el('p','m-detail','Conceptos núcleo extraídos del contenido real:'));
  const tg = el('div','tags');
  (cont.entidades || []).slice(0,10).forEach((e, i) => tg.appendChild(el('span','tag' + (i < 2 ? ' tag-accent' : ''), e)));
  if (!tg.children.length) tg.appendChild(el('span','tag','Sin entidades extraídas'));
  cSem.appendChild(tg);
  cSem.appendChild(metric('Claridad del núcleo del negocio', cl === null ? 'no_verificable' : cl >= 75 ? 'ok' : cl >= 50 ? 'warning' : 'error',
    cl === null ? null : cl + ' / 100', null));
  gridT.appendChild(cSem);

  /* ===== HUELLA DIGITAL EXTERNA (off-page, separada de SEO Técnico) ===== */
  seccion(root, 'Off-page', 'Huella digital externa',
    'Tu presencia fuera de tu propia web: dónde te mencionan, con cuánta fuerza y si la IA te reconoce como autoridad. Investigación orgánica y global, sin filtro de país.');
  const gridH = el('div','grid-cards colapsable');
  root.appendChild(gridH);

  const hue = r.huella_digital || {};
  const HK = [['presencia_foros','Foros y comunidades'],['medios','Medios y prensa'],['directorios','Directorios y reseñas'],['listas_sector','Listas y rankings del sector']];
  const cHue = card('Off-page', 'Presencia externa', hue._error ? 'muted' : worst(HK.map(([k]) => g(hue, k + '.estado'))));
  if (hue._error){
    cHue.appendChild(el('p','m-detail','La investigación de huella no devolvió un resultado estructurado en esta ejecución.'));
  } else {
    HK.forEach(([k, lab]) => {
      const o = hue[k];
      if (!o) return;
      const ex = (k === 'listas_sector' && (o.listas_encontradas || []).length)
        ? 'Listas: ' + o.listas_encontradas.slice(0,3).join(' · ') : null;
      cHue.appendChild(metric(lab, o.estado, o.calidad || null, [o.detalle, ex].filter(Boolean).join(' — '), o.fuentes));
    });
  }
  gridH.appendChild(cHue);

  /* E-E-A-T-C */
  const ee = hue.eeatc || {};
  const glob = typeof ee.puntuacion_global === 'number' ? ee.puntuacion_global : null;
  if (glob !== null || ee.experiencia){
    const cEe = card('Autoridad', 'E-E-A-T-C', glob === null ? 'muted' : glob >= 70 ? 'ok' : glob >= 40 ? 'warning' : 'error');
    [['experiencia','Experiencia'],['expertise','Expertise'],['autoridad','Autoridad'],['confianza','Confianza'],['citabilidad','Citabilidad']]
      .forEach(([k, lab]) => {
        const o = ee[k];
        if (!o) return;
        const v = typeof o.puntuacion === 'number' ? o.puntuacion : null;
        const w = el('div','eeatc');
        const rr = el('div','m-row');
        rr.appendChild(el('span','m-lbl', lab));
        const vv = el('span','m-val ' + (v === null ? 'v-muted' : v >= 70 ? 'v-ok' : v >= 40 ? 'v-warning' : 'v-error'));
        vv.textContent = v === null ? '–' : v + ' / 100';
        rr.appendChild(vv);
        w.appendChild(rr);
        w.appendChild(barra(v));
        if (o.detalle) w.appendChild(el('p','m-detail', o.detalle));
        cEe.appendChild(w);
      });
    if (glob !== null) cEe.appendChild(metric('Puntuación global',
      glob >= 70 ? 'ok' : glob >= 40 ? 'warning' : 'error', glob + ' / 100', hue.resumen || null));
    const car = (ee.carencias || []).slice(0,4);
    if (car.length) cEe.appendChild(metric('Carencias', 'warning', String(car.length), car.join(' · ')));
    gridH.appendChild(cEe);
  }

  /* ===== INFORME DE VISIBILIDAD ===== */
  const inf = r.informe_llm || {};
  const mapa = Array.isArray(r.mapa_competitivo) ? r.mapa_competitivo : [];
  if (inf.resumen_ejecutivo || inf.veredicto_visibilidad || mapa.length){
    seccion(root, 'Motores generativos', 'Tu visibilidad en las respuestas de la IA',
      '16 preguntas de usuario real lanzadas a ChatGPT, Claude y Perplexity, evaluadas por cuatro agentes especializados.');

    const niv = g(inf,'veredicto_visibilidad.nivel');
    if (niv){
      const v = el('div','verdict');
      v.appendChild(el('div','v-chip v-' + niv, niv));
      v.appendChild(el('p', null, g(inf,'veredicto_visibilidad.justificacion') || ''));
      root.appendChild(v);
    }
    if (inf.resumen_ejecutivo) root.appendChild(el('div','exec', inf.resumen_ejecutivo));

    const tv = inf.tabla_visibilidad || [];
    if (tv.length){
      const p = el('div','panel');
      p.appendChild(el('h3', null, 'Modelo por modelo'));
      p.appendChild(tabla(['Modelo','Descubrimiento','Conoce la marca','Sentimiento','Observación'],
        tv.map(t => [t.modelo || '', t.aparece_descubrimiento || '–', t.conoce_marca || '–', t.sentimiento || '–', t.observacion || ''])));
      root.appendChild(p);
    }

    /* ===== DONUTS + LISTA ===== */
    const cc = mapa.length ? mapa : (inf.conjunto_competitivo_consolidado || []);
    if (cc.length){
      const p = el('div','panel panel-dark');
      p.appendChild(el('span','eyebrow','Cuota de voz'));
      p.appendChild(el('h3', null, 'Quién ocupa tu espacio en las respuestas de la IA'));
      p.appendChild(el('p','card-text','Reparto de menciones entre tu marca y sus competidores, motor por motor. Tu marca aparece siempre, aunque su cuota sea cero.'));

      const brandName = (meta.brand || '').trim();
      const emp = cc.map(x => ({
        empresa: x.empresa || '',
        es_marca: !!x.es_marca || (brandName && String(x.empresa || '').toLowerCase() === brandName.toLowerCase()),
        menciones: typeof x.menciones === 'number' ? x.menciones : 0,
        pm: x.menciones_por_modelo || null,
        modelos: x.modelos || [],
        amenaza: x.amenaza || '–'
      }));
      if (brandName && !emp.some(e => e.es_marca)){
        emp.unshift({ empresa: brandName, es_marca: true, menciones: 0, pm: null, modelos: [], amenaza: '–' });
      }
      const valEn = (e, mk) => (e.pm && typeof e.pm[mk] === 'number') ? e.pm[mk] : ((e.modelos || []).includes(mk) ? 1 : 0);

      const PAL = ['#EFEBE3','#C3BCAE','#9A9284','#B8946F','#7A8A90','#D6CFC2','#A19889','#68757B'];
      const orden = [...emp].sort((a,b) => (b.es_marca?1:0)-(a.es_marca?1:0) || b.menciones - a.menciones);
      const TOP = 8;
      let ci = 0;
      const color = {};
      orden.slice(0, TOP).forEach(e => { color[e.empresa] = e.es_marca ? 'var(--gp-accent)' : PAL[ci++ % PAL.length]; });
      const resto = orden.slice(TOP);

      function donut(titulo, getVal){
        const sl = orden.slice(0, TOP).map(e => ({ n: e.empresa, marca: e.es_marca, v: getVal(e), c: color[e.empresa] }));
        const vr = resto.reduce((a,e) => a + getVal(e), 0);
        if (vr > 0) sl.push({ n: 'Otros', marca: false, v: vr, c: '#5C5952' });
        const total = sl.reduce((a,s) => a + s.v, 0);
        const m = sl.find(s => s.marca);
        const pct = total ? Math.round(((m ? m.v : 0) / total) * 100) : 0;

        const box = el('div','donut');
        box.appendChild(el('div','donut-t', titulo));
        const S = 150, R = 56, CX = 75, CY = 75, C = 2 * Math.PI * R;
        const s = svg('svg', { viewBox: '0 0 ' + S + ' ' + S });
        s.appendChild(svg('circle', { cx: CX, cy: CY, r: R, fill:'none', stroke:'#3D3B37', 'stroke-width':15 }));
        let off = 0;
        sl.forEach(x => {
          if (!x.v || !total) return;
          const len = (x.v / total) * C;
          const arc = svg('circle', { cx: CX, cy: CY, r: R, fill:'none', stroke: x.c,
            'stroke-width': x.marca ? 19 : 15,
            'stroke-dasharray': len + ' ' + (C - len), 'stroke-dashoffset': String(-off),
            transform: 'rotate(-90 ' + CX + ' ' + CY + ')' });
          const t = svg('title', {});
          t.textContent = x.n + ': ' + x.v + ' (' + Math.round((x.v/total)*100) + '%)';
          arc.appendChild(t);
          s.appendChild(arc);
          off += len;
        });
        const t1 = svg('text', { x: CX, y: CY - 1, 'text-anchor':'middle', 'dominant-baseline':'middle', class:'d-pct' });
        t1.textContent = total ? pct + '%' : '–';
        t1.setAttribute('fill', !total ? '#7C776F' : '#FF6152');
        s.appendChild(t1);
        const t2 = svg('text', { x: CX, y: CY + 18, 'text-anchor':'middle', class:'d-lbl' });
        t2.textContent = !total ? 'sin datos' : (pct ? 'tu marca' : 'no apareces');
        s.appendChild(t2);
        box.appendChild(s);
        return box;
      }

      const dg = el('div','donuts');
      dg.appendChild(donut('Total', e => e.menciones));
      MODELOS.forEach(([mk, ml]) => dg.appendChild(donut(ml, e => valEn(e, mk))));
      p.appendChild(dg);

      const leg = el('div','legend');
      orden.slice(0, TOP).forEach(e => {
        const it = el('span','leg' + (e.es_marca ? ' leg-brand' : ''));
        const dot = el('i');
        dot.style.background = color[e.empresa];
        it.appendChild(dot);
        it.appendChild(el('span', null, e.empresa + (e.es_marca ? ' (tu marca)' : '')));
        leg.appendChild(it);
      });
      if (resto.length){
        const it = el('span','leg');
        const dot = el('i');
        dot.style.background = '#5C5952';
        it.appendChild(dot);
        it.appendChild(el('span', null, 'Otros (' + resto.length + ')'));
        leg.appendChild(it);
      }
      p.appendChild(leg);

      const VIS = 5;
      const filas = orden.map(e => {
        const cells = [e.empresa + (e.es_marca ? ' · tu marca' : ''), String(e.menciones)];
        MODELOS.forEach(([mk]) => cells.push(String(valEn(e, mk))));
        cells.push(e.amenaza);
        return { cells, _brand: e.es_marca };
      });
      const tw = tabla(['Empresa','Menciones','ChatGPT','Claude','Perplexity','Amenaza'], filas, VIS);
      p.appendChild(tw);

      if (orden.length > VIS){
        const b = el('button','toggle');
        b.type = 'button';
        const lbl = el('span', null, 'Ver las ' + (orden.length - VIS) + ' empresas restantes');
        const pm = el('span','pm','+');
        b.appendChild(lbl); b.appendChild(pm);
        let open = false;
        b.addEventListener('click', () => {
          open = !open;
          tw.querySelectorAll('tr.hide').forEach(x => x.classList.toggle('show', open));
          lbl.textContent = open ? 'Ver menos' : ('Ver las ' + (orden.length - VIS) + ' empresas restantes');
          pm.textContent = open ? '–' : '+';
        });
        p.appendChild(b);
      }
      root.appendChild(p);
    }

    /* Dimensiones */
    const DIMS = [['descubrimiento','Descubrimiento','Visibilidad espontánea'],['competitivo','Competitivo','Posición frente a rivales'],
                  ['conocimiento','Conocimiento','Qué saben y si es cierto'],['reputacion','Reputación','Qué dicen ante una objeción']];
    const gd = el('div','grid-cards');
    DIMS.forEach(([k, eye, tit]) => {
      const dd = g(inf,'analisis_por_dimension.' + k);
      if (!dd) return;
      const c = card(eye, tit, 'muted');
      c.querySelector('.dot').remove();
      if (dd.resumen) c.appendChild(el('p','card-text', dd.resumen));
      if (dd.implicacion_negocio){
        const p = el('p','card-text');
        p.appendChild(el('b', null, 'Qué significa: '));
        p.appendChild(document.createTextNode(dd.implicacion_negocio));
        c.appendChild(p);
      }
      if (k === 'descubrimiento' && bl.descubrimiento){
        MODELOS.forEach(([mk, ml]) => {
          const pm = g(bl.descubrimiento, 'por_modelo.' + mk);
          if (!pm) return;
          const t = typeof pm.tasa_aparicion === 'number' ? pm.tasa_aparicion : null;
          c.appendChild(metric(ml, t === null ? 'no_verificable' : t >= 50 ? 'ok' : t > 0 ? 'warning' : 'error',
            (t === null ? '–' : t + '% de aparición') + (pm.posicion_media ? ' · pos. ' + pm.posicion_media : ''), null));
        });
      }
      if (k === 'conocimiento' && bl.conocimiento){
        MODELOS.forEach(([mk, ml]) => {
          const n = g(bl.conocimiento, 'nivel_conocimiento.' + mk);
          if (!n) return;
          c.appendChild(metric(ml, n === 'alto' ? 'ok' : n === 'medio' ? 'warning' : n === 'nulo' ? 'error' : 'warning', n, null));
        });
        /* Cómo describe cada modelo a la marca */
        const desc = bl.conocimiento.descripcion_percibida;
        if (desc && typeof desc === 'object'){
          MODELOS.forEach(([mk, ml]) => { if (desc[mk]) c.appendChild(el('p','m-detail', ml + ': “' + desc[mk] + '”')); });
        }
        const vf = bl.conocimiento.verificacion_factual || [];
        const con = vf.filter(x => x.veredicto === 'contradicha');
        const ver = vf.filter(x => x.veredicto === 'verificada');
        if (vf.length){
          c.appendChild(metric('Contraste con tu web real', con.length ? 'error' : 'ok',
            ver.length + ' verificadas · ' + con.length + ' contradichas', null));
          con.slice(0,3).forEach(x => c.appendChild(el('p','m-detail',
            '✕ ' + (x.modelo ? x.modelo + ': ' : '') + '“' + x.afirmacion + '” — ' + (x.evidencia || x.fuente_real || 'contradicho por la fuente real'))));
        }
        /* Riesgo de alucinación */
        const ra = bl.conocimiento.riesgo_alucinacion;
        if (ra && ra.nivel) c.appendChild(metric('Riesgo de alucinación',
          ra.nivel === 'bajo' ? 'ok' : ra.nivel === 'medio' ? 'warning' : 'error', ra.nivel, ra.detalle));
        /* Datos que la IA se inventa, con gravedad */
        const alu = bl.conocimiento.alucinaciones || [];
        if (alu.length){
          c.appendChild(metric('Datos inventados por la IA', 'error', String(alu.length), null));
          alu.slice(0,4).forEach(x => c.appendChild(el('p','m-detail',
            '✕ ' + (x.modelo ? x.modelo + ': ' : '') + '“' + x.afirmacion + '”' + (x.gravedad ? ' · gravedad ' + x.gravedad : ''))));
        }
        /* Contradicciones entre modelos */
        const contr = bl.conocimiento.contradicciones_entre_modelos || [];
        if (contr.length){
          c.appendChild(el('p','m-detail','Contradicciones entre modelos:'));
          contr.slice(0,3).forEach(x => c.appendChild(el('p','m-detail','· ' + x)));
        }
        /* Servicios que la IA atribuye bien / por error / omite */
        const sc = bl.conocimiento.servicios_correctos || [];
        const se = bl.conocimiento.servicios_erroneos || [];
        if (sc.length || se.length){
          const tg = el('div','tags');
          sc.slice(0,6).forEach(a => tg.appendChild(el('span','tag tag-ok', a)));
          se.slice(0,6).forEach(a => tg.appendChild(el('span','tag tag-neg', a)));
          c.appendChild(tg);
          c.appendChild(el('p','m-detail','Verde: servicios que la IA te atribuye bien. Rojo: los que te atribuye por error.'));
        }
        const sau = bl.conocimiento.servicios_ausentes || [];
        if (sau.length) c.appendChild(metric('Servicios que la IA no capta', 'warning', String(sau.length), sau.join(' · ')));
      }
      if (k === 'reputacion' && bl.reputacion){
        const pol = g(bl.reputacion,'polaridad_global');
        if (typeof pol === 'number') c.appendChild(metric('Polaridad global',
          pol >= 0.3 ? 'ok' : pol >= -0.2 ? 'warning' : 'error', (pol > 0 ? '+' : '') + pol.toFixed(2), null));
        /* Sentimiento y tono por cada modelo */
        const spm = bl.reputacion.sentimiento_por_modelo;
        if (spm && typeof spm === 'object'){
          MODELOS.forEach(([mk, ml]) => {
            const s = spm[mk];
            if (s && typeof s.polaridad === 'number') c.appendChild(metric(ml,
              s.polaridad >= 0.3 ? 'ok' : s.polaridad >= -0.2 ? 'warning' : 'error',
              (s.polaridad > 0 ? '+' : '') + s.polaridad.toFixed(2), s.tono));
          });
        }
        const df = bl.reputacion.defensa_de_marca;
        if (df) c.appendChild(metric('Defensa ante objeción', df.estado,
          df.deriva_a_competidor ? 'Deriva a ' + df.deriva_a_competidor : null, df.detalle));
        /* Cada objeción concreta, con modelo y si está respaldada por fuente */
        const obj = bl.reputacion.objeciones_detectadas || [];
        if (obj.length){
          c.appendChild(metric('Objeciones detectadas', 'warning', String(obj.length), null));
          obj.slice(0,5).forEach(x => c.appendChild(el('p','m-detail',
            '· ' + x.objecion + (x.modelo ? ' — ' + x.modelo : '') + (x.respaldada_por_fuente ? ' (con fuente real)' : ' (sin fuente: posible alucinación negativa)'))));
        }
        /* Riesgos reputacionales */
        const rr = bl.reputacion.riesgos_reputacionales || [];
        if (rr.length){
          c.appendChild(el('p','m-detail','Riesgos reputacionales:'));
          rr.slice(0,5).forEach(x => c.appendChild(el('p','m-detail','· ' + x)));
        }
        const neg = bl.reputacion.atributos_negativos || [];
        if (neg.length){
          const tg = el('div','tags');
          neg.slice(0,6).forEach(a => tg.appendChild(el('span','tag tag-neg', a)));
          c.appendChild(tg);
        }
        /* Fuentes negativas (dominios) */
        const fn = bl.reputacion.fuentes_negativas || [];
        if (fn.length) c.appendChild(metric('Fuentes negativas', 'error', String(fn.length),
          [...new Set(fn.map(u => String(u).replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0]))].slice(0,5).join(' · ')));
      }
      if (k === 'competitivo' && bl.competitivo){
        const ven = bl.competitivo.ventajas_percibidas || [];
        const gp = bl.competitivo.gaps_atributos || [];
        if (ven.length || gp.length){
          const tg = el('div','tags');
          ven.slice(0,5).forEach(a => tg.appendChild(el('span','tag tag-ok', a)));
          gp.slice(0,5).forEach(a => tg.appendChild(el('span','tag tag-neg', a)));
          c.appendChild(tg);
          c.appendChild(el('p','m-detail','Verde: atributos que la IA te asigna. Rojo: los que asigna a rivales y a ti no.'));
        }
        const ine = bl.competitivo.competidores_inesperados || [];
        if (ine.length) c.appendChild(metric('Rivales que no esperabas', 'warning', String(ine.length), ine.join(' · ')));
      }
      gd.appendChild(c);
    });
    if (gd.children.length) root.appendChild(gd);

    if (inf.divergencia_parametrico_grounded){
      const p = el('div','panel');
      p.appendChild(el('span','eyebrow','Memoria vs. web actual'));
      p.appendChild(el('h3', null, 'Lo que el modelo recuerda no es lo que la web dice hoy'));
      p.appendChild(el('p','card-text', inf.divergencia_parametrico_grounded));
      root.appendChild(p);
    }

    /* Fuentes del sector */
    const fs = r.fuentes_sector;
    if (fs && fs.disponible){
      const p = el('div','panel');
      p.appendChild(el('span','eyebrow','Dónde busca el motor'));
      p.appendChild(el('h3', null, 'Las fuentes que la IA consulta para tu sector'));
      p.appendChild(metric('Tu dominio entre las fuentes citadas', fs.cliente_citado ? 'ok' : 'error',
        fs.cliente_citado ? 'Citado' : 'No citado',
        fs.cliente_citado ? null : 'El motor respondió a las preguntas de tu sector sin citar tu web ni una vez. Estos son los dominios donde sí está buscando: ahí es donde hay que estar.'));
      const tg = el('div','tags');
      (fs.dominios_citados || []).slice(0,15).forEach(x => tg.appendChild(el('span','tag', x.dominio + ' ×' + x.veces)));
      if (tg.children.length) p.appendChild(tg);
      root.appendChild(p);
    }

    /* ===== DÓNDE GANAR PRESENCIA (recomendador determinista) ===== */
    const rh = r.recomendaciones_huella;
    if (rh && rh.disponible){
      const p = el('div','panel');
      p.appendChild(el('span','eyebrow','Plan de enlaces'));
      p.appendChild(el('h3', null, 'Dónde ganar presencia para que la IA te cite'));
      p.appendChild(el('p','card-text', rh.resumen));
      const RC = [['directorios','Directorios y reseñas'],['listas_sector','Listas y rankings del sector'],
                  ['medios','Medios y prensa'],['foros','Foros y comunidades'],['otros','Otros portales del sector']];
      RC.forEach(([k, lab]) => {
        const arr = rh[k] || [];
        if (!arr.length) return;
        const h = el('div','reco-group');
        h.appendChild(el('div','reco-cat', lab));
        arr.forEach(x => {
          const row = el('div','reco-item');
          const left = el('div','reco-left');
          const head = el('div','reco-head');
          if (x.url){
            const a = el('a','reco-site reco-link', x.sitio);
            a.href = x.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
            head.appendChild(a);
          } else {
            head.appendChild(el('span','reco-site', x.sitio));
          }
          /* Origen: la IA ya lo cita (dato duro) vs descubierto por búsqueda de sector */
          if (x.fuente === 'citado') head.appendChild(el('span','reco-src src-cita','La IA ya lo cita'));
          else if (x.fuente === 'descubierto') head.appendChild(el('span','reco-src src-desc','Descubierto'));
          left.appendChild(head);
          if (x.motivo) left.appendChild(el('span','reco-why', x.motivo));
          row.appendChild(left);
          const pr = String(x.prioridad || 'media').toLowerCase();
          row.appendChild(el('span','reco-pri pri-' + (['alta','media','baja'].includes(pr) ? pr : 'media'), pr));
          h.appendChild(row);
        });
        p.appendChild(h);
      });
      if ((rh.ya_presente_en || []).length){
        p.appendChild(el('p','m-detail','No se repiten los sitios donde ya tienes presencia: ' +
          rh.ya_presente_en.slice(0,8).join(' · ') + (rh.ya_presente_en.length > 8 ? ' …' : '')));
      }
      root.appendChild(p);
    }

    /* Gaps y oportunidades */
    const gaps = inf.gaps_criticos || [];
    if (gaps.length){
      const p = el('div','panel');
      p.appendChild(el('span','eyebrow','Los agujeros'));
      p.appendChild(el('h3', null, 'Gaps críticos'));
      gaps.forEach(x => {
        const dv = el('div','gap');
        dv.appendChild(el('div','g-t', x.gap || ''));
        if (x.evidencia) dv.appendChild(el('div','g-b','Evidencia: ' + x.evidencia));
        if (x.impacto) dv.appendChild(el('div','g-b','Impacto: ' + x.impacto));
        p.appendChild(dv);
      });
      const op = inf.oportunidades || [];
      if (op.length){
        const w = el('div','wins');
        w.appendChild(el('h4', null, 'Oportunidades'));
        const ul = el('ul');
        op.forEach(o => ul.appendChild(el('li', null, o)));
        w.appendChild(ul);
        p.appendChild(w);
      }
      root.appendChild(p);
    }

    /* Citas */
    const citas = inf.citas_destacadas || [];
    if (citas.length){
      const p = el('div','panel');
      p.appendChild(el('span','eyebrow','Textual'));
      p.appendChild(el('h3', null, 'Lo que la IA dice de ti, literalmente'));
      citas.forEach(x => {
        const q = el('div','quote');
        q.appendChild(el('p','q-t', '“' + (x.cita || '') + '”'));
        q.appendChild(el('p','q-m', [x.modelo, x.pregunta].filter(Boolean).join(' · ')));
        p.appendChild(q);
      });
      root.appendChild(p);
    }

    /* Plan LLM */
    const plan = inf.plan_accion_llm || [];
    if (plan.length){
      const p = el('div','panel');
      p.appendChild(el('span','eyebrow','Qué hacer'));
      p.appendChild(el('h3', null, 'Plan para ganar visibilidad en IA'));
      plan.forEach((a, i) => p.appendChild(accion(a, i)));
      root.appendChild(p);
    }

    /* KPIs */
    const kpis = inf.kpis_seguimiento || [];
    if (kpis.length){
      const p = el('div','panel');
      p.appendChild(el('span','eyebrow','Medición'));
      p.appendChild(el('h3', null, 'KPIs para la próxima auditoría'));
      p.appendChild(tabla(['KPI','Hoy','Objetivo'], kpis.map(k => [k.kpi || '', k.valor_actual || '–', k.objetivo || '–'])));
      root.appendChild(p);
    }
  }

  /* Plan global */
  const sin = r.sintesis || {};
  const pg = sin.plan_accion || [];
  if (pg.length || (sin.quick_wins || []).length){
    const p = el('div','panel');
    p.appendChild(el('span','eyebrow','Prioridades'));
    p.appendChild(el('h3', null, 'Plan de acción global'));
    pg.forEach((a, i) => p.appendChild(accion(a, i)));
    const qw = sin.quick_wins || [];
    if (qw.length){
      const w = el('div','wins');
      w.appendChild(el('h4', null, 'Quick wins · menos de un día'));
      const ul = el('ul');
      qw.forEach(x => ul.appendChild(el('li', null, x)));
      w.appendChild(ul);
      p.appendChild(w);
    }
    root.appendChild(p);
  }

  root.style.display = 'block';
}

/* ---------- Envío ---------- */
async function analyze(){
  const brand = $id('brand').value.trim();
  const domain = $id('domain').value.trim();
  const keyword = $id('keyword').value.trim();
  const competitors = $id('competitors').value.trim();
  const pais = $id('pais').value;
  const region = $id('region').value.trim();
  const email = $id('email').value.trim();
  const fe = $id('form-error');
  fe.style.display = 'none';

  if (!brand || !domain || !keyword){
    fe.textContent = 'Marca, dominio y término objetivo son obligatorios.';
    fe.style.display = 'block';
    return;
  }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    fe.textContent = 'El email no tiene un formato válido.';
    fe.style.display = 'block';
    return;
  }

  $id('results').style.display = 'none';
  $id('errbox').style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Analizando…';
  startLoader();

  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ brand, domain, keyword, competitors, pais, region, email }),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('El servidor respondió ' + res.status + ' ' + res.statusText);
    const data = await res.json();
    const rep = Array.isArray(data) ? data[0] : data;
    if (!rep || (!rep.score && !rep.meta)) throw new Error('La respuesta no tiene el formato de reporte esperado.');
    stopLoader();
    render(rep);
    /* Tras pintar y hacer visible el informe, colapsar los bloques demasiado largos */
    requestAnimationFrame(() => setTimeout(colapsarBloquesLargos, 60));
  } catch (err) {
    stopLoader();
    $id('errmsg').textContent = err.name === 'AbortError'
      ? 'La auditoría superó el tiempo de espera. El análisis puede seguir ejecutándose en el servidor: revisa la ejecución en n8n o inténtalo de nuevo.'
      : (err.message || 'Error de red. Comprueba la conexión y la configuración CORS del webhook.');
    $id('errbox').style.display = 'block';
  } finally {
    clearTimeout(to);
    btn.disabled = false;
    btn.textContent = 'Analizar visibilidad en IA';
  }
}

btn.addEventListener('click', analyze);
$id('retry').addEventListener('click', analyze);
shadow.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); }));

// Autocompletar desde la URL: la muestra gratuita enlaza aquí con los datos del análisis
// reducido (?brand=…&domain=…&keyword=…&pais=…&region=…) para no hacerlos escribir de nuevo.
try {
  const q = new URLSearchParams(window.location.search);
  const setV = (id, v) => { const e = $id(id); if (e && v) e.value = v; };
  setV('brand', q.get('brand'));
  setV('domain', q.get('domain'));
  setV('keyword', q.get('keyword'));
  setV('region', q.get('region'));
  const p = (q.get('pais') || '').toUpperCase().slice(0, 2);
  const sel = $id('pais');
  if (sel && p && Array.prototype.some.call(sel.options, o => o.value === p)) sel.value = p;
} catch (e) {}
})();
</script>
